id: "pygifr"
name: "CyberGif (pyGifr)"
script_path: "./gifs/pyGifr.py"
description: "Batch convert image folders into unified, auto-cropped high-quality GIFs and MP4s with smooth transitions."

arguments:
  - flag: "--dirs"
    name: "Input Directories"
    type: "text"
    placeholder: "/path/to/folder1 /path/to/folder2"
    required: true

  - flag: "--output"
    name: "Output GIF Path"
    type: "text"
    placeholder: "Omit to auto-generate filename"
    required: false

  - flag: "--width"
    name: "Output Width (px)"
    type: "integer"
    placeholder: "Auto (smallest width)"
    required: false

  - flag: "--height"
    name: "Output Height (px)"
    type: "integer"
    placeholder: "Auto (smallest height)"
    required: false

  - flag: "--hold"
    name: "Frame Hold Duration (sec)"
    type: "integer"
    default: "20"
    required: false

  - flag: "--fade"
    name: "Crossfade Duration (sec)"
    type: "integer"
    default: "5"
    required: false

  - flag: "--fps"
    name: "Frames Per Second (FPS)"
    type: "integer"
    default: "12"
    required: false
