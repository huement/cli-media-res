id: "code_snapshot"
name: "Code Snapshot Generator"
script_path: "./code_snapshots/snapshot.sh"
description: "Generates beautiful syntax-highlighted code screenshots using Silicon and ImageMagick."

arguments:
  # Core Inputs and Outputs
  - flag: "--input"
    name: "Input Source File or Directory"
    type: "file"
    required: true
    placeholder: "e.g., path/to/script.py or '-' for piped code"

  - flag: "--output"
    name: "Output Directory Target"
    type: "text"
    placeholder: "Omit to save to a local '/screenshots' folder"

  # Visual Theme Controls
  - flag: "--theme"
    name: "Syntactical Glow Preset"
    type: "choice"
    choices: ["basic", "cyberpunk", "1980"]
    default: "basic"

  - flag: "--lang"
    name: "Language Syntax Override"
    type: "text"
    placeholder: "e.g., python, bash, javascript (Useful for stdin pipes)"

  - flag: "--font"
    name: "Render Font Family"
    type: "text"
    default: "FiraCode Nerd Font Mono Med"

  # Image Processing Modifiers (ImageMagick)
  - flag: "--text"
    name: "Overlay Text / Watermark"
    type: "text"
    placeholder: "Adds a custom banner along the bottom edge"

  - flag: "--rounded"
    name: "Round Canvas Edges"
    type: "boolean"
    default: false

  - flag: "--vignette"
    name: "Apply Vignette Shadow Framing"
    type: "boolean"
    default: false

  - flag: "--border"
    name: "Draw Cyan Frame Outline"
    type: "boolean"
    default: false

  # Core Chrome Disables
  - flag: "--no-numbers"
    name: "Strip Line Numbers"
    type: "boolean"
    default: false

  - flag: "--no-window"
    name: "Hide Window Borders & Controls"
    type: "boolean"
    default: false

  - flag: "--no-shadow"
    name: "Drop Backlight Shadow"
    type: "boolean"
    default: false
