id: "media_optimize"
name: "Video Optimizer"
script_path: "vid_mog/media_optimize.py"
description: "Media Optimizer: Handles smart upscaling, downscaling, bitrate target adjustments, and watermarking."

arguments:
  # Core Inputs & Outputs
  - flag: "--input"
    name: "Input File or Directory (-i)"
    type: "file"
    required: true
    placeholder: "Select MP4 video file or folder..."
    description: "Input folder containing mp4 files or a path to a single mp4 file."

  - flag: "--output"
    name: "Output Folder (-o)"
    type: "file"
    placeholder: "Defaults to input directory"
    description: "Output folder for processed files."

  - flag: "--bitrate"
    name: "Video Bitrate (-b)"
    type: "text"
    default: "2000k"
    description: "Video encoding target bitrate."

  # Smart Scaling Modifiers
  - flag: "--optimize"
    name: "Optimization & Upscale Target"
    type: "choice"
    choices: ["none", "720p", "1080p", "1440p", "4k"]
    default: "none"
    description: "Applies high-quality denoising and upscales if the source video is below target size."

  - flag: "--downscale"
    name: "Downscale Height (-ds)"
    type: "choice"
    choices: ["none", "720p", "1080p", "1440p", "4k"]
    default: "none"
    description: "Downscale video to target height proportion (e.g., 720p, 480) using hardware acceleration."

  # Watermarks
  - flag: "--watermark"
    name: "Watermark Overlay Image (-wm)"
    type: "file"
    placeholder: "Path to PNG watermark..."

  - flag: "--wm-width"
    name: "Watermark Width (px) (-ww)"
    type: "integer"
    default: "120"
