id: "media_optimize"
name: "Video Optimizer"
script_path: "./vid_mog/media-optimize.sh"
description: "Ultimate Video Toolkit: Combines smart optimization, motion interpolation, and creative FX filters."

arguments:
  # Paths & Core Settings
  - flag: "--input"
    name: "Input Path (-i)"
    type: "file"
    required: true
    placeholder: "File path (.mp4) or directory containing videos"
    description: "Input folder containing mp4 files or a path to a single mp4 file."

  - flag: "--output"
    name: "Output Path (-o)"
    type: "text"
    placeholder: "Defaults to input file location or parent dir"
    description: "Output folder for processed files."

  - flag: "--bitrate"
    name: "Video Bitrate (-b)"
    type: "text"
    default: "2000k"
    description: "Video bitrate (Default: 2000k)."

  - flag: "--rotate"
    name: "Video Rotation (-r)"
    type: "text"
    default: "0"
    description: "Video rotation angle in degrees (Default: 0)."

  - flag: "--downscale"
    name: "Downscale Height (-ds)"
    type: "text"
    placeholder: "e.g., 720p, 480 (Leave blank to keep source resolution)"
    description: "Downscale video to target height proportion (e.g., 720p, 480) using libx264 CRF 24."

  # Watermark Adjustments
  - flag: "--watermark"
    name: "Watermark Image Path (-wm)"
    type: "file"
    placeholder: "Path to the watermark image."
    description: "Path to the watermark image."

  - flag: "--wm-width"
    name: "Watermark Width (-ww)"
    type: "integer"
    default: "120"
    description: "Width of the watermark (Default: 120)."

  # Core Processing Modifiers
  - flag: "--optimize"
    name: "Optimization & Upscale Target"
    type: "choice"
    choices: ["none", "720p", "1080p", "1440p", "4k"]
    default: "none"
    description: "Applies high-quality denoising and upscales if the source video is below the target size."

  # Framerate & Motion Interpolation
  - flag: "--slowsmooth"
    name: "Ultra-Smooth Slow-Mo"
    type: "boolean"
    description: "Enable ultra-smooth motion interpolation slow-mo (50% speed, 60fps)."

  - flag: "--ghosting"
    name: "Dreamy Frame Blending"
    type: "boolean"
    description: "Enable dreamy frame-blending slow-mo (50% speed, 60fps)."

  # Color Grading
  - flag: "--lut"
    name: "3D LUT Curve (-l)"
    type: "file"
    placeholder: "Path to the .cube LUT file."
    description: "Path to the .cube LUT file."

  # Creative Special Effects (FX)
  - flag: "--bloom"
    name: "FX: Bloom & Glow"
    type: "boolean"
    description: "Enable bloom / glow effect."

  - flag: "--twinkle"
    name: "FX: Starfield Twinkle"
    type: "boolean"
    description: "Enable starfield twinkling effect."

  - flag: "--aberration"
    name: "FX: Chromatic Aberration"
    type: "boolean"
    description: "Enable chromatic aberration effect."

  - flag: "--crush"
    name: "FX: Deep Black Shadow Crush"
    type: "boolean"
    description: "Enable deep black shadow crush curves."

  - flag: "--glitch"
    name: "FX: RGB Shift Glitch"
    type: "boolean"
    description: "Enable anaglyphic RGB shift glitch effect."

  - flag: "--grain"
    name: "FX: Cinematic Film Grain"
    type: "boolean"
    description: "Enable film grain effect."
