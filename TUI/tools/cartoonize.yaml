id: "pyviddy_cartoonize"
name: "AI Cartoonizer (TensorFlow)"
script_path: "./vid_mog/pyviddy/cartoonize.py"
description: "White-box Cartoonization pipeline using Deep Learning and Guided Filters."

arguments:
  # Core Path Configurations
  - flag: "--input"
    name: "Input Video Path"
    type: "file"
    required: true
    placeholder: "/path/to/source_video.mp4"

  - flag: "--output"
    name: "Output Video Path"
    type: "text"
    placeholder: "Omit to auto-generate structured filename in source folder"

  # Algorithmic Hyperparameters
  - flag: "--radius"
    name: "Guided Filter Radius"
    type: "integer"
    default: "1"

  - flag: "--eps"
    name: "Epsilon Smoothing Curve"
    type: "text"
    default: "5e-3"
    placeholder: "e.g., 5e-3 or 0.005"

  - flag: "--intensity"
    name: "Stylization Intensity"
    type: "text"
    default: "1.0"
    placeholder: "Value from 0.0 to 1.0"