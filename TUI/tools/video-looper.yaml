id: "pyviddy_looper"
name: "Video Looper Utility"
script_path: "./vid_mog/pyviddy/looper.py"
description: "Generate seamless repeat blocks or reverse boomerang cross-fade sequences."

arguments:
  - flag: "--input"
    name: "Input Video Path"
    type: "file"
    required: true

  - flag: "--output"
    name: "Output Destination Path"
    type: "text"
    placeholder: "e.g., ./output/sequence_looped.mp4"

  - flag: "--mode"
    name: "Looping Style Profile"
    type: "choice"
    choices: ["repeat", "boomerang"]
    default: "repeat"

  - flag: "--count"
    name: "Repetition Count (Repeat mode only)"
    type: "integer"
    default: "3"

  - flag: "--fade"
    name: "Seamless Crossfade Window (Seconds)"
    type: "text"
    default: "1.0"

  - flag: "--gpu"
    name: "Hardware Acceleration"
    type: "boolean"
    description: "Enable NVENC GPU acceleration curves"